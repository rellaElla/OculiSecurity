version: "3.9"

# Oculi Security Gateway — Full Stack
# Services: oculi-gateway | oculi-upstream-fs | oculi-upstream-http | oculi-opa
#
# Usage:
#   docker compose up --build
#   docker compose up --build -d   (detached)
#   docker compose logs -f oculi-gateway

networks:
  oculi-net:
    driver: bridge

volumes:
  oculi-gateway-data:

services:

  # ── OPA Policy Engine ────────────────────────────────────────────────────────
  oculi-opa:
    image: openpolicyagent/opa:latest
    command: run --server --log-level=info --addr=0.0.0.0:8181
      /policies/gateway.rego /policies/data.json
    volumes:
      - ./policies:/policies:ro
    ports:
      - "8181:8181"
    networks:
      - oculi-net
    restart: unless-stopped
    # The rootless OPA image has no shell/wget; use service_started in gateway depends_on.
    # OPA is ready within ~1s so the gateway's built-in retry is sufficient.

  # ── Demo Filesystem Upstream ─────────────────────────────────────────────────
  oculi-upstream-fs:
    build:
      context: ./apps/demo-upstream-fs
      dockerfile: Dockerfile
    environment:
      FS_PORT: "3001"
      LOG_LEVEL: "info"
    ports:
      - "3001:3001"
    networks:
      - oculi-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Demo HTTP Fetch Upstream ─────────────────────────────────────────────────
  oculi-upstream-http:
    build:
      context: ./apps/demo-upstream-http
      dockerfile: Dockerfile
    environment:
      HTTP_PORT: "3002"
      LOG_LEVEL: "info"
    ports:
      - "3002:3002"
    networks:
      - oculi-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3002/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Security Gateway ─────────────────────────────────────────────────────────
  oculi-gateway:
    build:
      context: ./apps/gateway
      dockerfile: Dockerfile
    environment:
      PORT: "3000"
      LOG_LEVEL: "info"
      # IMPORTANT: Change JWT_SECRET in production
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-in-production-min32chars!!}"
      OPA_URL: "http://oculi-opa:8181"
      OPA_ENABLED: "true"
      DB_PATH: "/data/audit.db"
      STORE_FULL_ARGS: "${STORE_FULL_ARGS:-true}"
      RATE_LIMIT_CAPACITY: "${RATE_LIMIT_CAPACITY:-10}"
      RATE_LIMIT_REFILL: "${RATE_LIMIT_REFILL:-2}"
      FS_SERVER_URL: "http://oculi-upstream-fs:3001"
      HTTP_SERVER_URL: "http://oculi-upstream-http:3002"
    volumes:
      - oculi-gateway-data:/data
    ports:
      - "3000:3000"
    networks:
      - oculi-net
    restart: unless-stopped
    depends_on:
      oculi-opa:
        condition: service_started   # rootless OPA has no wget; it's ready in ~1s
      oculi-upstream-fs:
        condition: service_healthy
      oculi-upstream-http:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 15
