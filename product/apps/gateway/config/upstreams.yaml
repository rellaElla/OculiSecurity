# MCP Upstream Server Registry
# Add new upstreams here; also update policies/gateway.rego tool_allowlists.
upstreams:
  - id: fs-server
    name: "Demo Filesystem Server"
    baseUrl: "${FS_SERVER_URL:-http://localhost:3001}"
    # authHeader: "Bearer my-upstream-token"  # optional upstream auth
    timeout: 5000
    tools:
      - readFile
      - listDir
      - writeFile

  - id: http-server
    name: "Demo HTTP Fetch Server"
    baseUrl: "${HTTP_SERVER_URL:-http://localhost:3002}"
    timeout: 10000
    tools:
      - fetchUrl
      - postUrl
